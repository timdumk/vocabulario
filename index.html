<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vocabulario</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f4ecd9">
  <!-- iOS Home-Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Vocabulario">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- ============ HOME ============ -->
    <section class="view" id="view-home">
      <div id="homeContent"></div>
    </section>

    <!-- ============ LISTE (alle Vokabeln) ============ -->
    <section class="view" id="view-liste" hidden>
      <h2 class="view-title">Alle Vokabeln</h2>
      <!-- Themen-Filter: waagerecht scrollbar, filtert die Liste (eigener
           Zustand `listCat` — NICHT der Übungsfilter `selectedCat`). -->
      <div class="cat-chips" id="listCats"></div>
      <input id="listeSearch" class="search" type="search" placeholder="Suchen… (Spanisch oder Deutsch)" autocomplete="off">
      <details class="addbox">
        <summary>+ Eigene Vokabel</summary>
        <input id="addEs" class="add-input" placeholder="Spanisch" autocomplete="off">
        <input id="addDe" class="add-input" placeholder="Deutsch" autocomplete="off">
        <input id="addCat" class="add-input" placeholder="Thema (optional, sonst „Eigene“)" autocomplete="off">
        <button id="addBtn" class="btn">Hinzufügen</button>
      </details>
      <div id="listeContent"></div>
    </section>

    <!-- ============ FEHLER / MARKIERT ============ -->
    <section class="view" id="view-fehler" hidden>
      <h2 class="view-title">Markiert &amp; Fehler</h2>
      <div id="fehlerContent"></div>
    </section>

    <!-- ============ EINSTELLUNGEN ============ -->
    <section class="view" id="view-settings" hidden>
      <h2 class="view-title">Mehr</h2>
      <div id="settingsContent"></div>
    </section>
  </main>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="tabbar">
    <div class="tab-pill" id="tabPill"></div>
    <button class="tab active" data-view="home">
      <svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2"/><path d="M6.2 10v9.2h11.6V10"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-view="liste">
      <svg viewBox="0 0 24 24"><line x1="8" y1="7" x2="20" y2="7"/><line x1="8" y1="12" x2="20" y2="12"/><line x1="8" y1="17" x2="20" y2="17"/><circle cx="4" cy="7" r="1.3"/><circle cx="4" cy="12" r="1.3"/><circle cx="4" cy="17" r="1.3"/></svg>
      <span>Vokabeln</span>
    </button>
    <button class="tab" data-view="fehler">
      <svg viewBox="0 0 24 24"><polygon points="12,3 14.6,9 21,9.5 16,13.8 17.6,20 12,16.5 6.4,20 8,13.8 3,9.5 9.4,9"/></svg>
      <span>Fehler</span>
    </button>
    <button class="tab" data-view="settings">
      <svg viewBox="0 0 24 24"><line x1="4" y1="8" x2="20" y2="8"/><circle cx="9" cy="8" r="2.5"/><line x1="4" y1="16" x2="20" y2="16"/><circle cx="15" cy="16" r="2.5"/></svg>
      <span>Mehr</span>
    </button>
  </nav>

  <!-- ============ ÜBUNG: eigener Vollbild-Flow (ohne Tab-Bar) ============ -->
  <div class="practice" id="practice" hidden>
    <div class="practice-top">
      <div class="practice-bar">
        <button id="practiceExit" class="icon-btn" aria-label="Übung beenden">
          <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
        <div class="progress" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
        <span class="progress-count" id="progressCount"></span>
      </div>
      <!-- Womit übe ich gerade? Im Fokus-Modus trägt das #focusBanner den Kontext. -->
      <p class="practice-ctx" id="practiceCtx"></p>
    </div>

    <div class="practice-body" id="practiceBody">
      <div id="focusBanner" class="banner" hidden>
        <span id="focusText">Fokus: markierte / Fehler</span>
        <button id="focusExit" class="banner-x" aria-label="Fokus beenden">✕</button>
      </div>

      <!-- Karte + Weiter-Button sitzen als Block mittig im freien Raum -->
      <div class="practice-center">
      <section id="card" class="card">
        <div class="card-top">
          <button id="speakBtn" class="speak" aria-label="Wort vorlesen"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a4 4 0 0 1 0 7"/></svg></button>
          <span id="cardStreak" class="card-streak" hidden></span>
          <button id="markBtn" class="mark" aria-label="Vokabel markieren">☆</button>
        </div>
        <p class="prompt-label" id="promptLabel">Was bedeutet…</p>
        <h2 id="word">…</h2>
        <div id="qmeta" class="qmeta" hidden></div>
        <div id="options" class="options"></div>
        <p id="feedback" class="feedback"></p>
      </section>

      <button id="nextBtn" class="next" hidden>Weiter →</button>
      </div>
    </div>

    <!-- Zusammenfassung nach Rundenende -->
    <div class="summary" id="summary" hidden></div>
  </div>

  <!-- ============ START-SHEET: Übung einrichten ============ -->
  <div class="sheet-back" id="startSheet" hidden>
    <div class="sheet">
      <div class="sheet-grab"></div>
      <h2 class="sheet-title">Übung einrichten</h2>

      <div class="modes">
        <button id="modeVocab" class="mode active">Vokabeln</button>
        <button id="modeVerbs" class="mode">Verben</button>
      </div>

      <div class="modes submodes" id="practiceModes">
        <button class="mode active" data-practice="mc">Wahl</button>
        <button class="mode" data-practice="write">Schreiben</button>
        <button class="mode" data-practice="cards">Karten</button>
        <button class="mode" data-practice="gap">Lücke</button>
      </div>

      <div class="controls" id="vocabControls">
        <button id="dirToggle" class="chip">🇪🇸 → 🇩🇪</button>
        <button id="catBtn" class="chip">Alle Themen</button>
      </div>
      <div id="catPanel" class="panel" hidden></div>

      <div class="controls" id="verbControls" hidden>
        <button id="tenseToggle" class="chip">Alle Zeiten</button>
        <button id="typeToggle" class="chip">Alle Verben</button>
      </div>

      <div class="modes lengths" id="lengthModes">
        <button class="mode active" data-len="10">10 Fragen</button>
        <button class="mode" data-len="0">Endlos</button>
      </div>

      <button id="sheetStart" class="btn">Los geht’s</button>
      <button id="sheetCancel" class="btn secondary">Abbrechen</button>
    </div>
  </div>

  <!-- ============ WORT-DETAIL: reine Anzeige (Inhalt kommt aus app.js) ============ -->
  <div class="sheet-back" id="wordSheet" hidden>
    <div class="sheet" id="wordSheetBody"></div>
  </div>

  <!-- ============ Bestätigung: Übung verlassen ============ -->
  <div class="dialog-back" id="confirmExit" hidden>
    <div class="dialog">
      <p class="dialog-title" id="confirmTitle">Übung beenden?</p>
      <p class="dialog-text" id="confirmText">Der Fortschritt dieser Runde wird nicht gewertet.</p>
      <div class="dialog-actions">
        <button class="btn secondary" id="confirmNo">Abbrechen</button>
        <button class="btn" id="confirmYes">Beenden</button>
      </div>
    </div>
  </div>

  <!-- ============ Haptik-Ausloeser (iOS) ============
       iOS Safari kennt navigator.vibrate() nicht. Seit iOS 17.4 rendert es aber
       <input type="checkbox" switch> als nativen Schalter, dessen Umlegen ein
       System-Haptik ausloest. Der Schalter hier ist unsichtbar und dient nur
       diesem Zweck. Auf allen anderen Plattformen bleibt er ungenutzt. -->
  <label class="haptic-trigger" id="hapticLabel" aria-hidden="true">
    <input type="checkbox" switch id="hapticSwitch" tabindex="-1">
  </label>

  <!-- ============ Meilenstein-Badge ============ -->
  <div class="milestone" id="milestone" hidden></div>

  <script src="vocab.js"></script>
  <script src="sentences.js"></script>
  <script src="verbs.js"></script>
  <script src="app.js"></script>
</body>
</html>
